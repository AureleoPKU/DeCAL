[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot"
version = "1.0"
description = "DeCAL: a tactile-augmented vision-language-action policy for robotic manipulation"
readme = "README.md"
license = { text = "CC BY-NC-SA 4.0" }
requires-python = ">=3.10"
authors = [
    { name = "CAI Junhao", email = "caijunhao@pjlab.org.cn" },
    { name = "Zeng Jia", email = "zengjia@pjlab.org.cn" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["lerobot", "huggingface", "robotics",  "machine learning", "artificial intelligence"]

dependencies = [

    # Hugging Face dependencies
    "datasets>=4.0.0,<4.2.0",
    "diffusers>=0.27.2,<0.36.0",
    "huggingface-hub[hf-transfer,cli]>=0.34.2,<0.36.0",
    "accelerate>=1.10.0,<2.0.0",
    "transformers==4.57.1",

    # Core dependencies
    "setuptools>=71.0.0,<81.0.0",
    "cmake>=3.29.0.1,<4.2.0",
    "einops>=0.8.0,<0.9.0",
    "fsspec>=2023.10.0",
    "loguru>=0.7.0,<1.0.0",
    "mediapy>=1.2.0,<2.0.0",
    "numpy>=1.24.0,<3.0.0",
    "opencv-python-headless>=4.9.0,<4.13.0",
    "pandas>=2.0.0,<3.0.0",
    "pillow>=10.0.0,<13.0.0",
    "pyarrow>=15.0.0,<24.0.0",
    "PyYAML>=6.0.0,<7.0.0",
    "requests>=2.31.0,<3.0.0",
    "safetensors>=0.4.0,<1.0.0",
    "tqdm>=4.66.0,<5.0.0",
    "typing-extensions>=4.10.0,<5.0.0",
    "tyro>=0.9.0,<2.0.0",
    "av>=15.0.0,<16.0.0",
    "jsonlines>=4.0.0,<5.0.0",
    "packaging>=24.2,<26.0",
    "wandb>=0.20.0,<0.22.0", # TODO: Bumb dependency (compatible with protobuf)

    "torch>=2.2.1,<2.8.0", # TODO: Bumb dependency
    "torchcodec>=0.2.1,<0.6.0; sys_platform != 'win32' and (sys_platform != 'linux' or (platform_machine != 'aarch64' and platform_machine != 'arm64' and platform_machine != 'armv7l')) and (sys_platform != 'darwin' or platform_machine != 'x86_64')", # TODO: Bumb dependency
    "torchvision>=0.21.0,<0.23.0", # TODO: Bumb dependency

    "draccus==0.10.0", # TODO: Remove ==
    "rerun-sdk>=0.24.0,<0.27.0",

    # Support dependencies
    "imageio[ffmpeg]>=2.34.0,<3.0.0",
    "termcolor>=2.4.0,<4.0.0",
]

[project.optional-dependencies]
deploy = [
    "fastapi>=0.115.0,<1.0.0",
    "json-numpy>=1.0.0,<2.0.0",
    "uvicorn>=0.30.0,<1.0.0",
]
eval = [
    "lpips>=0.1.4,<0.2.0",
    "matplotlib>=3.8.0,<4.0.0",
]
dev = [
    "pytest>=8.0.0,<9.0.0",
]
